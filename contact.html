        <!-- Contact Form Section -->
        <section class="contact-section">
            <form action="https://formspree.io/f/mwpbbvpg" method="POST" class="contact-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required maxlength="100"
                            pattern="[A-Za-z\s\-']{2,100}">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required maxlength="254">
                    </div>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required maxlength="200">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required maxlength="2000"
                        placeholder="Tell me about your project or inquiry..."></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Send Message</span>
                    <svg class="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="m22 2-7 20-4-9-9-4 20-7z" />
                    </svg>
                </button>
            </form>

    <!-- Form Enhancement Script -->
    <script>
        // Enhanced form submission with feedback
        document.querySelector('.contact-form').addEventListener('submit', function (e) {
            const button = document.querySelector('.submit-btn');
            const originalText = button.innerHTML;

            // Show loading state
            button.innerHTML = '<span>Sending...</span>';
            button.disabled = true;

            // Reset after timeout (in case form submission takes time)
            setTimeout(() => {
                button.innerHTML = originalText;
                button.disabled = false;
            }, 5000);
        });

        // Form field animation on focus
        document.querySelectorAll('input, textarea').forEach(field => {
            field.addEventListener('focus', function () {
                this.parentElement.classList.add('focused');
            });

            field.addEventListener('blur', function () {
                if (!this.value) {
                    this.parentElement.classList.remove('focused');
                }
            });
        });
    </script>
